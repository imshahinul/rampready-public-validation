name: RampReady paired validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampready-paired-validation
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify branch synchronization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run paired official-source collector
        shell: bash
        run: |
          set -euo pipefail
          python rampready-prospective-validation/collect.py

      - name: Persist prospective evidence
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --             rampready-prospective-validation/history.jsonl             rampready-prospective-validation/runs             rampready-prospective-validation/state

          if git diff --cached --quiet; then
            echo "No new prospective evidence to commit."
            exit 0
          fi

          scheduled_date="$(
            python - <<'PYDATE'
from datetime import datetime, timezone
print(datetime.now(timezone.utc).date().isoformat())
PYDATE
          )"

          git commit             -m "data: record RampReady paired observation ${scheduled_date}"

          git push origin HEAD:main
